              namespace = "com.nexa.ai"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.nexa.ai"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
                  buildConfigField("String", "GEMINI_KEY", "\"${(System.getenv("GEMINI_API_KEY") ?: "").trim().trim('"')}\"")
                  buildConfigField("String", "GROQ_KEY", "\"${(System.getenv("GROQ_API_KEY") ?: "").trim().trim('"')}\"")
                  buildConfigField("String", "OLYNTAQ_KEY", "\"${(System.getenv("OLYNTAQ_API_KEY") ?: "").trim().trim('"')}\"")
              }
              buildFeatures { compose = true; buildConfig = true }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat > $D/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries>
              <application android:label="Nexa AI" ICON_PLACEHOLDER android:theme="@style/Theme.Nexa">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatingService" android:exported="false"/>
                  <service android:name=".VoiceService" android:exported="false" android:foregroundServiceType="microphone"/>
                  <receiver android:name=".NexaWidget" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/nexa_widget_info"/>
                  </receiver>
              </application>
          </manifest>
          EOF

          sed -i "s|ICON_PLACEHOLDER|$ICON_ATTR|" $D/app/src/main/AndroidManifest.xml

          echo "Resources included:"
          find $RES -type f -exec ls -l {} \; 2>/dev/null || echo "(none)"

      - name: Check API key secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OLYNTAQ_API_KEY: ${{ secrets.OLYNTAQ_API_KEY }}
        run: |
          [ -n "$GROQ_API_KEY" ] && echo "Groq key (chat): present" || echo "Groq key (chat): missing"
          [ -n "$OLYNTAQ_API_KEY" ] && echo "OLYNTAQ key (chat): present" || echo "OLYNTAQ key (chat): missing"
          [ -n "$GEMINI_API_KEY" ] && echo "Gemini key (pictures): present" || echo "Gemini key (pictures): missing"
          if [ -z "$GROQ_API_KEY" ] && [ -z "$OLYNTAQ_API_KEY" ]; then
            echo "No chat key found. Add GROQ_API_KEY and/or OLYNTAQ_API_KEY under Settings > Secrets and variables > Actions > Secrets"; exit 1
          fi

      - name: Build debug APK
        working-directory: nexa-build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OLYNTAQ_API_KEY: ${{ secrets.OLYNTAQ_API_KEY }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NexaAI-debug
          path: nexa-build/app/build/outputs/apk/debug/*.apk
