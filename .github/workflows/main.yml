          OLYNTAQ_API_KEY: ${{ secrets.OLYNTAQ_API_KEY }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NexaAI-debug
          path: nexa-build/app/build/outputs/apk/debug/*.apk
