                      if max(r, g, b) < T:
                          mp[x, y] = 255
              border = [(x, 0) for x in range(w)] + [(x, h - 1) for x in range(w)] + [(0, y) for y in range(h)] + [(w - 1, y) for y in range(h)]
              for pt in border:
