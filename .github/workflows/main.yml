name: Build Nexa AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Assemble project
        run: |
          D=nexa-build
          mkdir -p $D/app/src/main/java/com/nexa/ai
          cp MainActivity.kt FloatingService.kt $D/app/src/main/java/com/nexa/ai/

          # Branding: root files (icon.png, robot.png, logo.png) OR
          # app/src/main/res/drawable/nexa_robot.png and nexa_icon.png
          RES=$D/app/src/main/res
          ICON_ATTR=""

          if [ -f icon.png ]; then
            mkdir -p $RES/mipmap-xxxhdpi
            cp icon.png $RES/mipmap-xxxhdpi/ic_launcher.png
            ICON_ATTR='android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"'
          fi
          if [ -f robot.png ]; then
            mkdir -p $RES/drawable-nodpi
            cp robot.png $RES/drawable-nodpi/nexa_robot.png
          fi
          if [ -f logo.png ]; then
            mkdir -p $RES/drawable-nodpi
            cp logo.png $RES/drawable-nodpi/nexa_logo.png
          fi

          if [ -f app/src/main/res/drawable/nexa_robot.png ]; then
            mkdir -p $RES/drawable-nodpi
            cp app/src/main/res/drawable/nexa_robot.png $RES/drawable-nodpi/nexa_robot.png
          fi
          if [ -f app/src/main/res/drawable/nexa_icon.png ]; then
            mkdir -p $RES/drawable-nodpi $RES/mipmap-xxxhdpi
            cp app/src/main/res/drawable/nexa_icon.png $RES/drawable-nodpi/nexa_logo.png
            cp app/src/main/res/drawable/nexa_icon.png $RES/mipmap-xxxhdpi/ic_launcher.png
            ICON_ATTR='android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"'
          fi

          cat > $D/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NexaAI"
          include(":app")
          EOF

          cat > $D/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF

          printf 'org.gradle.jvmargs=-Xmx2g\nandroid.useAndroidX=true\n' > $D/gradle.properties

          cat > $D/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.nexa.ai"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.nexa.ai"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
                  buildConfigField("String", "GEMINI_KEY", "\"${System.getenv("GEMINI_API_KEY") ?: ""}\"")
              }
              buildFeatures { compose = true; buildConfig = true }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat > $D/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries>
              <application android:label="Nexa AI" ICON_PLACEHOLDER android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatingService" android:exported="false"/>
              </application>
          </manifest>
          EOF

          sed -i "s|ICON_PLACEHOLDER|$ICON_ATTR|" $D/app/src/main/AndroidManifest.xml

          echo "Resources included:"
          ls -R $RES 2>/dev/null || echo "(none)"

      - name: Check API key secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY SECRET IS EMPTY - add it under Settings > Secrets and variables > Actions > Secrets"; exit 1; }

      - name: Build debug APK
        working-directory: nexa-build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NexaAI-debug
          path: nexa-build/app/build/outputs/apk/debug/*.apk
