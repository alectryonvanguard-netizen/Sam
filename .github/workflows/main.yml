name: Build Nexa AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Assemble project
        run: |
          D=nexa-build
          mkdir -p $D/app/src/main/java/com/nexa/ai
          cp MainActivity.kt FloatingService.kt $D/app/src/main/java/com/nexa/ai/
          SRC_KT=$D/app/src/main/java/com/nexa/ai/MainActivity.kt
          # Google retired gemini-2.0-flash; use the model its error message asks for
          sed -i 's/call("gemini-2.0-flash",/call("gemini-3.8-flash",/' $SRC_KT

          # Patch MainActivity.kt while building:
          #  1) chat header: remove the "Online" line, keep only the logo and the name
          #  2) if VoiceScreen.kt exists in the repo, it replaces the old voice screen
          cat > /tmp/patch.py <<'PY2'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          s2 = re.sub(r'; T\(if \(Store\.busy\) "Typing\.\.\." else "Online", 11, Color\(0xFF34D399\)\)', '', s)
          if s2 == s:
              print("WARNING: Online line not found, chat header left unchanged")
          s = s2
          # 3) AI calls: time limits (no more endless loading), Gemini 3.8 -> 3.6 fallback, Groq first when its key exists
          sig = "private fun call(model: String, body: JSONObject): JSONObject {"
          if sig in s:
              helper = """private val TEXT_MODELS = listOf("gemini-3.8-flash", "gemini-3.6-flash")
          private fun call(model: String, body: JSONObject): JSONObject {
              if (!model.startsWith("gemini-3") || model.contains("image")) return callOnce(model, body)
              var last = JSONObject()
              for (m in TEXT_MODELS) {
                  for (attempt in 0..1) {
                      val r = try { callOnce(m, body) } catch (e: Exception) {
                          last = JSONObject().put("error", JSONObject().put("code", 0).put("message", "Network problem: " + e.message))
                          break
                      }
                      last = r
                      val err = r.optJSONObject("error") ?: return r
                      val msg = err.optString("message")
                      val code = err.optInt("code")
                      val retry = code == 503 || code == 429 || code == 404 || msg.contains("high demand", true) || msg.contains("overloaded", true)
                      if (!retry) return r
                      Thread.sleep(800)
                  }
              }
              return last
          }
          private fun callOnce(model: String, body: JSONObject): JSONObject {"""
              s = s.replace(sig, helper, 1)
          else:
              print("WARNING: Gemini call() not found, model fallback not added")

          conn = "val c = u.openConnection() as HttpURLConnection"
          if conn in s:
              s = s.replace(conn, conn + """
          c.connectTimeout = 8000; c.readTimeout = if (model.contains("image")) 90000 else 25000""", 1)
          else:
              print("WARNING: connection line not found, time limits not added")

          tsig = "fun text(prompt: String, bmp: Bitmap?): String {"
          if tsig in s:
              groq = """fun text(prompt: String, bmp: Bitmap?): String {
              // Gemini is only used when a picture is attached. Normal chat: Groq, then OLYNTAQ.
              if (bmp != null) return geminiText(prompt, bmp)
              if (BuildConfig.GROQ_KEY.isNotBlank()) {
                  val g = groqText(prompt)
                  if (g != null) return g
              }
              if (BuildConfig.OLYNTAQ_KEY.isNotBlank()) {
                  val o = olyntaqText(prompt)
                  if (o != null) return o
              }
              return "Error: no chat AI answered. Check your internet and your Groq and OLYNTAQ keys, then try again."
          }
          private fun groqText(prompt: String): String? {
              for (m in listOf("llama-3.3-70b-versatile", "openai/gpt-oss-120b", "llama-3.1-8b-instant")) {
                  try {
                      val c = URL("https://api.groq.com/openai/v1/chat/completions").openConnection() as HttpURLConnection
                      c.connectTimeout = 8000; c.readTimeout = 20000
                      c.requestMethod = "POST"; c.doOutput = true
                      c.setRequestProperty("Content-Type", "application/json")
                      c.setRequestProperty("Authorization", "Bearer " + BuildConfig.GROQ_KEY)
                      val body = JSONObject().put("model", m).put("messages", JSONArray().put(JSONObject().put("role", "user").put("content", prompt)))
                      c.outputStream.use { it.write(body.toString().toByteArray()) }
                      val txt = (if (c.responseCode < 400) c.inputStream else c.errorStream).bufferedReader().readText()
                      val r = JSONObject(txt)
                      if (r.has("error")) continue
                      return r.getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content")
                  } catch (e: Exception) { }
              }
              return null
          }
          private fun geminiText(prompt: String, bmp: Bitmap?): String {"""
              s = s.replace(tsig, groq, 1)
          else:
              print("WARNING: text() not found, Groq not added")

          isig = "fun image(prompt: String): Pair<Bitmap?, String> {"
          s = s.replace("gemini-2.0-flash-preview-image-generation", "gemini-3.1-flash-image-preview")
          if isig in s:
              newimg = """fun image(prompt: String): Pair<Bitmap?, String> {
              var why = "Could not create the image. Check your internet and try again."
              try {
                  val q = java.net.URLEncoder.encode(prompt, "UTF-8").replace("+", "%20")
                  val c = URL("https://image.pollinations.ai/prompt/" + q + "?width=768&height=768&nologo=true&model=flux").openConnection() as HttpURLConnection
                  c.connectTimeout = 8000; c.readTimeout = 75000
                  if (c.responseCode < 400) {
                      val bytes = c.inputStream.use { it.readBytes() }
                      val bm = BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                      if (bm != null) return bm to ""
                  } else if (c.responseCode == 429) why = "The free image service is busy. Wait about 20 seconds and try again."
              } catch (e: Exception) { why = "Image service not reachable: " + e.message }
              if (BuildConfig.GEMINI_KEY.isNotBlank()) {
                  val g = geminiImage(prompt)
                  if (g.first != null) return g
              }
              return null to why
          }
          private fun geminiImage(prompt: String): Pair<Bitmap?, String> {"""
              s = s.replace(isig, newimg, 1)
          else:
              print("WARNING: image() not found, image fix not added")

          # 4) chat: a new message replaces the unfinished answer; history is titled by topic and saved
          def sub1(old, new, label, rx=False):
              global s
              s2 = re.sub(old, lambda m: new, s, count=1) if rx else s.replace(old, new, 1)
              if s2 == s:
                  print("WARNING: " + label + " not found, skipped")
              s = s2

          sub1("var busy by mutableStateOf(false);", "var turn = 0; var busy by mutableStateOf(false);", "Store.busy")
          sub1(r"class Chat\(val title: String\)\s*\{\s*val msgs = mutableStateListOf<Msg>\(\)\s*\}",
               "class Chat(title0: String) { var title by mutableStateOf(title0); var named = false; val msgs = mutableStateListOf<Msg>() }", "Chat class", True)
          sub1("c.msgs.add(Msg(text, true, bmp)); busy = true", "c.msgs.add(Msg(text, true, bmp)); busy = true; turn += 1; val my = turn", "ask start")
          sub1("c.msgs.add(Msg(r, false)); busy = false", "if (my != turn) return@launch\n        c.msgs.add(Msg(r, false)); busy = false", "ask reply")
          sub1("done(r)", """done(r)
                  if (!c.named) {
                      c.named = true
                      val first = c.msgs.firstOrNull { it.mine }?.text ?: text
                      val t = withContext(Dispatchers.IO) { Gemini.title(first) }
                      if (t.isNotBlank()) c.title = t
                  }
                  saveChats(ctx)""", "topic title")
          sub1("input.isNotBlank() && !Store.busy", "input.isNotBlank()", "send while busy")
          sub1("fun langTag() = when (lang) {", """fun saveChats(c: Context) {
                  try {
                      val arr = JSONArray()
                      for (ch in chats) {
                          val ms = JSONArray()
                          for (x in ch.msgs) ms.put(JSONObject().put("t", x.text).put("m", x.mine))
                          arr.put(JSONObject().put("title", ch.title).put("msgs", ms))
                      }
                      File(c.filesDir, "chats.json").writeText(arr.toString())
                  } catch (e: Exception) { }
              }
              fun loadChats(c: Context) {
                  try {
                      val f = File(c.filesDir, "chats.json")
                      if (!f.exists()) return
                      val arr = JSONArray(f.readText())
                      chats.clear()
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val ch = Chat(o.getString("title")); ch.named = true
                          val ms = o.getJSONArray("msgs")
                          for (j in 0 until ms.length()) { val x = ms.getJSONObject(j); ch.msgs.add(Msg(x.getString("t"), x.getBoolean("m"))) }
                          chats.add(ch)
                      }
                  } catch (e: Exception) { }
              }
              fun langTag() = when (lang) {""", "chat saving")
          sub1('prefs = c.getSharedPreferences("nexa", 0)', 'prefs = c.getSharedPreferences("nexa", 0); loadChats(c)', "load chats")
          sub1("private fun groqText(prompt: String): String? {", """fun title(q: String): String {
              val r = text("Write a title of 2 to 5 words for the main topic of this message. Reply with only the title, no quotes. Message: " + q.take(300), null)
              if (r.startsWith("Error") || r.startsWith("Nexa isn't")) return ""
              return r.lines().first().trim().trim('"', '*', '.').take(40)
          }
          private fun olyntaqText(prompt: String): String? {
              val base = "https://olyntaq-api-djjp.onrender.com"
              for (path in listOf("/v1/chat/completions", "/chat/completions")) {
                  for (m in listOf("olyntaq", "nvidia/nemotron-3.5-lightning-30b-a3b")) {
                      try {
                          val c = URL(base + path).openConnection() as HttpURLConnection
                          c.connectTimeout = 10000; c.readTimeout = 60000
                          c.requestMethod = "POST"; c.doOutput = true
                          c.setRequestProperty("Content-Type", "application/json")
                          c.setRequestProperty("Authorization", "Bearer " + BuildConfig.OLYNTAQ_KEY)
                          c.setRequestProperty("x-api-key", BuildConfig.OLYNTAQ_KEY)
                          val body = JSONObject().put("model", m)
                              .put("messages", JSONArray().put(JSONObject().put("role", "user").put("content", prompt)))
                              .put("stream", false)
                          c.outputStream.use { it.write(body.toString().toByteArray()) }
                          if (c.responseCode == 404) break
                          val txt = (if (c.responseCode < 400) c.inputStream else c.errorStream).bufferedReader().readText()
                          val r = JSONObject(txt)
                          val v = r.getJSONArray("choices").getJSONObject(0).getJSONObject("message").optString("content", "")
                          if (v.isNotBlank() && v != "null") return v
                      } catch (e: java.net.SocketTimeoutException) {
                          return null
                      } catch (e: Exception) { }
                  }
              }
              return null
          }
          private fun groqText(prompt: String): String? {""", "title helper")
          if len(sys.argv) > 2 and sys.argv[2] == "voice":
              # 5) voice keeps going on the home screen; the floating bubble shows up if overlay is allowed
              sub1("override fun onResume() { super.onResume(); Store.foreground = true }", """override fun onResume() {
                  super.onResume(); Store.foreground = true
                  if (VoiceFlag.bubbleStarted) { stopService(Intent(this, FloatingService::class.java)); VoiceFlag.bubbleStarted = false }
              }""", "onResume")
              sub1("override fun onPause() { super.onPause(); Store.foreground = false }", """override fun onPause() {
                  super.onPause(); Store.foreground = false; Store.saveChats(this)
                  if (VoiceFlag.active && !Store.floating && Settings.canDrawOverlays(this)) {
                      startService(Intent(this, FloatingService::class.java)); Store.floating = true; VoiceFlag.bubbleStarted = true
                  }
              }""", "onPause")
          if len(sys.argv) > 2 and sys.argv[2] == "voice":
              a = s.find("@Composable fun VoiceScreen() {")
              b = s.find("@Composable fun ImageGen() {")
              if a < 0 or b < 0 or b < a:
                  print("ERROR: old VoiceScreen not found in MainActivity.kt")
                  sys.exit(1)
              s = s[:a] + s[b:]
          open(p, "w", encoding="utf-8").write(s)
          PY2
          if [ -f VoiceScreen.kt ]; then
            [ -f VoiceService.kt ] || { echo "ERROR: upload VoiceService.kt to the repo (next to VoiceScreen.kt)"; exit 1; }
            cp VoiceScreen.kt VoiceService.kt $D/app/src/main/java/com/nexa/ai/
            python3 /tmp/patch.py $SRC_KT voice
          else
            python3 /tmp/patch.py $SRC_KT
          fi

          # ---- Branding images: resized safely, skipped if they cannot be processed ----
          RES=$D/app/src/main/res
          ICON_ATTR=""
          pip install --quiet pillow 2>/dev/null || pip install --quiet --break-system-packages pillow 2>/dev/null || true
          cat > /tmp/rs.py <<'PY'
          import sys
          from PIL import Image, ImageDraw
          src, dst, px = sys.argv[1], sys.argv[2], int(sys.argv[3])
          cut = len(sys.argv) > 4 and sys.argv[4] == "cut"
          im = Image.open(src).convert("RGBA")
          im.thumbnail((px, px))
          if cut:
              # remove the black background that touches the image edges (soft edge, keeps dark parts inside the robot)
              T = 120
              w, h = im.size
              pix = im.load()
              mask = Image.new("L", (w, h), 0)
              mp = mask.load()
              for y in range(h):
                  for x in range(w):
                      r, g, b, a = pix[x, y]
                      if max(r, g, b) < T:
                          mp[x, y] = 255
              border = [(x, 0) for x in range(w)] + [(x, h - 1) for x in range(w)] + [(0, y) for y in range(h)] + [(w - 1, y) for y in range(h)]
              for pt in border:
                  if mp[pt] == 255:
                      ImageDraw.floodfill(mask, pt, 128)
              for y in range(h):
                  for x in range(w):
                      if mp[x, y] == 128:
                          r, g, b, a = pix[x, y]
                          pix[x, y] = (r, g, b, min(255, max(r, g, b) * 255 // T))
          im.save(dst, "PNG")
          PY
          rs() {
            python3 /tmp/rs.py "$1" "$2" "$3" "$4" && return 0
            magick "$1[0]" -resize "${3}x${3}>" PNG32:"$2" && return 0
            convert "$1[0]" -resize "${3}x${3}>" PNG32:"$2" && return 0
            return 1
          }
          pick() { for f in "$@"; do if [ -f "$f" ]; then echo "$f"; return 0; fi; done; return 0; }

          ROBOT=$(pick nexa_robot.png robot.png app/src/main/res/drawable/nexa_robot.png)
          LOGO=$(pick nexa_icon.png logo.png app/src/main/res/drawable/nexa_icon.png)
          ICON=$(pick icon.png nexa_icon.png app/src/main/res/drawable/nexa_icon.png)
          echo "robot=$ROBOT logo=$LOGO icon=$ICON"

          if [ -n "$ROBOT" ]; then
            mkdir -p $RES/drawable-nodpi
            rs "$ROBOT" $RES/drawable-nodpi/nexa_robot.png 512 cut || { echo "robot resize failed, skipped"; rm -f $RES/drawable-nodpi/nexa_robot.png; }
          fi
          if [ -n "$LOGO" ]; then
            mkdir -p $RES/drawable-nodpi
            rs "$LOGO" $RES/drawable-nodpi/nexa_logo.png 256 cut || { echo "logo resize failed, skipped"; rm -f $RES/drawable-nodpi/nexa_logo.png; }
          fi
          if [ -n "$ICON" ]; then
            mkdir -p $RES/mipmap-xxxhdpi
            if rs "$ICON" $RES/mipmap-xxxhdpi/ic_launcher.png 192; then
              ICON_ATTR='android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"'
            else
              echo "icon resize failed, default icon used"; rm -f $RES/mipmap-xxxhdpi/ic_launcher.png
            fi
          fi

          # Plain dark launch screen (no icon in a white box on Android 12+)
          mkdir -p $RES/values $RES/values-v31
          cat > $RES/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Nexa" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#FF040612</item>
              </style>
          </resources>
          EOF
          cat > $RES/values-v31/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Nexa" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#FF040612</item>
                  <item name="android:windowSplashScreenBackground">#FF040612</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@android:color/transparent</item>
              </style>
          </resources>
          EOF

          cat > $D/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NexaAI"
          include(":app")
          EOF

          cat > $D/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF

          printf 'org.gradle.jvmargs=-Xmx2g\nandroid.useAndroidX=true\n' > $D/gradle.properties

          cat > $D/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.nexa.ai"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.nexa.ai"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
                  buildConfigField("String", "GEMINI_KEY", "\"${System.getenv("GEMINI_API_KEY") ?: ""}\"")
                  buildConfigField("String", "GROQ_KEY", "\"${System.getenv("GROQ_API_KEY") ?: ""}\"")
                  buildConfigField("String", "OLYNTAQ_KEY", "\"${System.getenv("OLYNTAQ_API_KEY") ?: ""}\"")
              }
              buildFeatures { compose = true; buildConfig = true }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat > $D/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries>
              <application android:label="Nexa AI" ICON_PLACEHOLDER android:theme="@style/Theme.Nexa">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatingService" android:exported="false"/>
                  <service android:name=".VoiceService" android:exported="false" android:foregroundServiceType="microphone"/>
              </application>
          </manifest>
          EOF

          sed -i "s|ICON_PLACEHOLDER|$ICON_ATTR|" $D/app/src/main/AndroidManifest.xml

          echo "Resources included:"
          find $RES -type f -exec ls -l {} \; 2>/dev/null || echo "(none)"

      - name: Check API key secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OLYNTAQ_API_KEY: ${{ secrets.OLYNTAQ_API_KEY }}
        run: |
          [ -n "$GROQ_API_KEY" ] && echo "Groq key (chat): present" || echo "Groq key (chat): missing"
          [ -n "$OLYNTAQ_API_KEY" ] && echo "OLYNTAQ key (chat): present" || echo "OLYNTAQ key (chat): missing"
          [ -n "$GEMINI_API_KEY" ] && echo "Gemini key (pictures): present" || echo "Gemini key (pictures): missing"
          if [ -z "$GROQ_API_KEY" ] && [ -z "$OLYNTAQ_API_KEY" ]; then
            echo "No chat key found. Add GROQ_API_KEY and/or OLYNTAQ_API_KEY under Settings > Secrets and variables > Actions > Secrets"; exit 1
          fi

      - name: Build debug APK
        working-directory: nexa-build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OLYNTAQ_API_KEY: ${{ secrets.OLYNTAQ_API_KEY }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NexaAI-debug
          path: nexa-build/app/build/outputs/apk/debug/*.apk
