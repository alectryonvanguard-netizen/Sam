name: Build Nexa AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Assemble project
        run: |
          D=nexa-build
          mkdir -p $D/app/src/main/java/com/nexa/ai
          cp MainActivity.kt FloatingService.kt $D/app/src/main/java/com/nexa/ai/
          SRC_KT=$D/app/src/main/java/com/nexa/ai/MainActivity.kt
          # Google retired gemini-2.0-flash; use the model its error message asks for
          sed -i 's/call("gemini-2.0-flash",/call("gemini-3.8-flash",/' $SRC_KT

          # Patch MainActivity.kt while building:
          #  1) chat header: remove the "Online" line, keep only the logo and the name
          #  2) if VoiceScreen.kt exists in the repo, it replaces the old voice screen
          cat > /tmp/patch.py <<'PY2'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          s2 = re.sub(r'; T\(if \(Store\.busy\) "Typing\.\.\." else "Online", 11, Color\(0xFF34D399\)\)', '', s)
          if s2 == s:
              print("WARNING: Online line not found, chat header left unchanged")
          s = s2
          # 3) AI calls: time limits (no more endless loading), Gemini 3.8 -> 3.6 fallback, Groq first when its key exists
          sig = "private fun call(model: String, body: JSONObject): JSONObject {"
          if sig in s:
              helper = """private val TEXT_MODELS = listOf("gemini-3.8-flash", "gemini-3.6-flash")
          private fun call(model: String, body: JSONObject): JSONObject {
              if (!model.startsWith("gemini-3") || model.contains("image")) return callOnce(model, body)
              var last = JSONObject()
              for (m in TEXT_MODELS) {
                  for (attempt in 0..1) {
                      val r = try { callOnce(m, body) } catch (e: Exception) {
                          last = JSONObject().put("error", JSONObject().put("code", 0).put("message", "Network problem: " + e.message))
                          break
                      }
                      last = r
                      val err = r.optJSONObject("error") ?: return r
                      val msg = err.optString("message")
                      val code = err.optInt("code")
                      val retry = code == 503 || code == 429 || code == 404 || msg.contains("high demand", true) || msg.contains("overloaded", true)
                      if (!retry) return r
                      Thread.sleep(800)
                  }
              }
              return last
          }
          private fun callOnce(model: String, body: JSONObject): JSONObject {"""
              s = s.replace(sig, helper, 1)
          else:
              print("WARNING: Gemini call() not found, model fallback not added")

          conn = "val c = u.openConnection() as HttpURLConnection"
          if conn in s:
              s = s.replace(conn, conn + """
          c.connectTimeout = 8000; c.readTimeout = if (model.contains("image")) 90000 else 25000""", 1)
          else:
              print("WARNING: connection line not found, time limits not added")

          tsig = "fun text(prompt: String, bmp: Bitmap?): String {"
          if tsig in s:
              groq = """private const val SHOW_DEBUG = false
          private var failMsg = ""
          private fun friendly(raw: String, image: Boolean = false): String {
              val l = raw.lowercase()
              val msg = when {
                  l.contains("resolve host") || l.contains("unknownhost") || l.contains("no address associated") || l.contains("unreachable") || l.contains("connection abort") || l.contains("connection reset") || l.contains("failed to connect") || l.contains("connectexception") || l.contains("no route") ->
                      "You are offline. Nexa AI can't work without internet. Please check your connection and try again."
                  l.contains("timed out") || l.contains("timeout") -> "The connection is too slow right now. Please try again."
                  l.contains("safety") || l.contains("blocked") || l.contains("prohibited") || l.contains("policy") -> "The AI could not do that request because of its safety rules. Please try wording it differently."
                  l.contains("quota") || l.contains("rate limit") || l.contains("exceeded") || l.contains("429") -> if (image) "Image generation limit is over for now. Please try again later." else "The AI service has reached its limit for now. Please try again later."
                  l.contains("high demand") || l.contains("overloaded") || l.contains("503") || l.contains("unavailable") -> "The AI service is busy right now. Please try again in a moment."
                  else -> if (image) "Could not create the image right now. Please try again." else "Nexa AI could not answer right now. Please try again."
              }
              return if (SHOW_DEBUG) msg + " (" + raw.take(200) + ")" else msg
          }
          // Tries the chat AIs in order. Returns null when none of them answered (reason saved in failMsg).
          private fun chain(prompt0: String, bmp: Bitmap?, hist: List<Pair<String, String>> = emptyList()): String? {
              histTl.set(hist)
              failMsg = ""
              val cmd = Regex("(?i)gemini access")
              val wantGemini = cmd.containsMatchIn(prompt0)
              val prompt = if (wantGemini) prompt0.replace(cmd, "").trim().ifBlank { "Hello" } else prompt0
              if (wantGemini || bmp != null) {
                  val g = geminiText(prompt, bmp)
                  if (!g.startsWith("Error") && !g.startsWith("Nexa isn't")) return g
                  failMsg = g
                  if (bmp != null && !wantGemini) return null
                  // "gemini access" did not work: fall back to the normal chat AIs below
              }
              if (BuildConfig.GROQ_KEY.isNotBlank()) {
                  val g = groqText(prompt)
                  if (g != null) return g
              }
              if (BuildConfig.OLYNTAQ_KEY.isNotBlank()) {
                  val o = olyntaqText(prompt)
                  if (o != null) return o
              }
              failMsg = failMsg + " Groq: " + groqWhy + " | OLYNTAQ: " + olyWhy
              return null
          }
          private val histTl = ThreadLocal<List<Pair<String, String>>>()
          private fun curHist(): List<Pair<String, String>> = histTl.get() ?: emptyList()
          @Volatile private var lastImage: Bitmap? = null
          fun takeImage(): Bitmap? { val b = lastImage; lastImage = null; return b }
          fun isFailure(s: String): Boolean = s.startsWith("You are offline") || s.startsWith("The connection is too slow") || s.startsWith("The AI service") || s.startsWith("The AI could not") || s.startsWith("Nexa AI could not answer") || s.startsWith("Image generation limit") || s.startsWith("Could not create the image")
          private fun msgsFor(prompt: String): JSONArray {
              val a = JSONArray().put(JSONObject().put("role", "system").put("content", NEXA_SYSTEM))
              for ((r, t) in curHist()) a.put(JSONObject().put("role", r).put("content", t))
              a.put(JSONObject().put("role", "user").put("content", prompt))
              return a
          }
          // Gemini wants roles to alternate, so neighbours with the same role are merged
          private fun gemContents(parts: JSONArray): JSONArray {
              val roles = ArrayList<String>(); val texts = ArrayList<String>()
              for ((r, t) in curHist()) {
                  val role = if (r == "user") "user" else "model"
                  if (roles.isEmpty() && role != "user") continue
                  if (roles.isNotEmpty() && roles.last() == role) texts[texts.size - 1] = texts.last() + " " + t
                  else { roles.add(role); texts.add(t) }
              }
              val a = JSONArray()
              for (i in roles.indices) a.put(JSONObject().put("role", roles[i]).put("parts", JSONArray().put(JSONObject().put("text", texts[i]))))
              a.put(JSONObject().put("role", "user").put("parts", parts))
              return a
          }
          private fun wantsImage(p: String): Boolean {
              val l = p.lowercase().trim()
              if (l.startsWith("/image")) return true
              val w = " " + l.replace(Regex("[^a-z0-9 ]"), " ").trim() + " "
              val block = listOf(" code ", " script ", " python ", " kotlin ", " java ", " function ", " program ", " editor ", " editing ", " website ", " html ", " css ", " api ", " library ", " software ", " tool ", " class ", " algorithm ", " bot ")
              if (block.any { w.contains(it) }) return false
              val nouns = listOf(" image ", " images ", " photo ", " photos ", " picture ", " pictures ", " pic ", " illustration ", " drawing ", " artwork ", " logo ", " wallpaper ", " poster ", " portrait ", " painting ")
              if (nouns.none { w.contains(it) }) return false
              var s = w.trim()
              for (i in 0..3) for (pre in listOf("please ", "hey ", "hi ", "can you ", "could you ", "would you ", "will you ", "i want you to ", "i want to ", "i need you to ", "i would like you to ", "kindly ", "nexa ")) if (s.startsWith(pre)) s = s.removePrefix(pre)
              val verbs = listOf("generate", "create", "draw", "make", "design", "paint", "imagine", "produce", "show", "give", "render", "sketch")
              return verbs.any { s.startsWith(it + " ") }
          }
          private fun wantsEdit(p: String): Boolean {
              val l = p.lowercase()
              val keys = listOf("change style", "change the style", "change its style", "new style", "style to", "in the style", "restyle", "anime", "cartoon", "pixar", "ghibli", "cyberpunk", "watercolor", "oil painting", "sketch", "turn this into", "turn it into", "turn this to", "make it look", "make this look", "convert this", "convert it", "redraw", "transform this", "transform it")
              return keys.any { l.contains(it) }
          }
          private fun imageSubject(p: String): String {
              val l = p.lowercase()
              for (k in listOf("image of ", "picture of ", "photo of ", "pic of ", "illustration of ", "drawing of ", "painting of ", "portrait of ", "poster of ", "wallpaper of ", "logo of ", "logo for ", "image showing ", "picture showing ")) {
                  val i = l.indexOf(k)
                  if (i >= 0) return p.substring(i + k.length).trim().ifBlank { p }
              }
              return p.removePrefix("/image").trim().ifBlank { p }
          }
          private fun geminiEdit(prompt: String, bmp: Bitmap): Bitmap? {
              if (BuildConfig.GEMINI_KEY.isBlank()) return null
              try {
                  val parts = JSONArray().put(JSONObject().put("text", prompt)).put(JSONObject().put("inlineData", JSONObject().put("mimeType", "image/jpeg").put("data", b64(bmp))))
                  val body = JSONObject().put("contents", JSONArray().put(JSONObject().put("parts", parts)))
                      .put("generationConfig", JSONObject().put("responseModalities", JSONArray().put("TEXT").put("IMAGE")))
                  val r = call("gemini-3.1-flash-image-preview", body)
                  if (r.has("error")) return null
                  val ps = r.getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts")
                  for (i in 0 until ps.length()) {
                      val q = ps.getJSONObject(i)
                      if (q.has("inlineData")) {
                          val bytes = Base64.decode(q.getJSONObject("inlineData").getString("data"), Base64.DEFAULT)
                          return BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                      }
                  }
              } catch (e: Exception) { }
              return null
          }
          // 1) real photo editing with Gemini (needs a Google key that allows images), 2) otherwise describe the photo and redraw it in the new style
          private fun editPhoto(request: String, bmp: Bitmap): Pair<Bitmap?, String> {
              val real = geminiEdit(request, bmp)
              if (real != null) return real to "Here is your edited photo."
              val desc = geminiText("Describe this photo in one detailed sentence (subject, clothing, pose, colors, background) so an artist could redraw it. Reply with only the description.", bmp)
              if (desc.startsWith("Error") || desc.startsWith("Nexa isn't")) return null to friendly(desc, true)
              val (b, err) = image(desc + ". Style: " + request)
              if (b != null) return b to "Here is your photo in the new style. It was redrawn by AI, so some details may look different."
              return null to err
          }
          fun text(prompt: String, bmp: Bitmap?, hist: List<Pair<String, String>> = emptyList(), images: Boolean = true): String {
              lastImage = null
              histTl.set(emptyList())
              if (images) {
                  val cmd = Regex("(?i)gemini access")
                  val clean = prompt.replace(cmd, "").trim()
                  val tag = if (cmd.containsMatchIn(prompt)) " gemini access" else ""
                  if (bmp == null && wantsImage(clean)) {
                      val (b, err) = image(imageSubject(clean) + tag)
                      if (b != null) { lastImage = b; return "Here is your picture." }
                      return err
                  }
                  if (bmp != null && wantsEdit(clean)) {
                      val (b, msg) = editPhoto(clean, bmp)
                      if (b != null) { lastImage = b }
                      return msg
                  }
              }
              return chain(prompt, bmp, hist) ?: friendly(failMsg)
          }
          private val NEXA_SYSTEM = "You are Nexa AI, a friendly assistant inside the Nexa AI app. Your name is Nexa AI. If someone asks your name, say you are Nexa AI, and do not say you are ChatGPT or made by OpenAI. If asked which model or company powers you, say you do not know those details. Keep explanations clear and reasonably short, but never cut code short. When you write code, always put it in a fenced code block that starts with the language name, and for long programs give the complete file in one single code block with your explanation outside it. The user mostly works on coding and video editing projects. Remember the whole conversation and stay on its topic: answer follow-up questions using the earlier messages, and only change the topic when the user does."
          private var groqWhy = "no Groq key in this build"
          private var olyWhy = "no OLYNTAQ key in this build"
          private fun groqText(prompt: String): String? {
              for (m in listOf("llama-3.3-70b-versatile", "openai/gpt-oss-120b", "llama-3.1-8b-instant")) {
                  try {
                      val c = URL("https://api.groq.com/openai/v1/chat/completions").openConnection() as HttpURLConnection
                      c.connectTimeout = 8000; c.readTimeout = 60000
                      c.requestMethod = "POST"; c.doOutput = true
                      c.setRequestProperty("Content-Type", "application/json")
                      c.setRequestProperty("Authorization", "Bearer " + BuildConfig.GROQ_KEY)
                      val body = JSONObject().put("model", m).put("messages", msgsFor(prompt)).put("max_tokens", 8000)
                      c.outputStream.use { it.write(body.toString().toByteArray()) }
                      val txt = (if (c.responseCode < 400) c.inputStream else c.errorStream).bufferedReader().readText()
                      val r = JSONObject(txt)
                      if (r.has("error")) { groqWhy = "HTTP " + c.responseCode + " " + txt.take(110); continue }
                      return r.getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content")
                  } catch (e: Exception) { groqWhy = e.toString().take(110) }
              }
              return null
          }
          private fun geminiText(prompt: String, bmp: Bitmap?): String {"""
              s = s.replace(tsig, groq, 1)
          else:
              print("WARNING: text() not found, Groq not added")

          isig = "fun image(prompt: String): Pair<Bitmap?, String> {"
          s = s.replace("gemini-2.0-flash-preview-image-generation", "gemini-3.1-flash-image-preview")
          if isig in s:
              newimg = """private var olyImgWhy = "no OLYNTAQ key in this build"
          private fun olyntaqImage(prompt: String): Bitmap? {
              if (BuildConfig.OLYNTAQ_KEY.isBlank()) return null
              try {
                  val c = URL("https://olyntaq-api.onrender.com/v1/images/generations").openConnection() as HttpURLConnection
                  c.connectTimeout = 10000; c.readTimeout = 90000
                  c.requestMethod = "POST"; c.doOutput = true
                  c.setRequestProperty("Content-Type", "application/json")
                  c.setRequestProperty("Authorization", "Bearer " + BuildConfig.OLYNTAQ_KEY)
                  c.setRequestProperty("x-api-key", BuildConfig.OLYNTAQ_KEY)
                  val body = JSONObject().put("model", "olyntaq").put("prompt", prompt).put("n", 1).put("size", "1024x1024")
                  c.outputStream.use { it.write(body.toString().toByteArray()) }
                  val code = c.responseCode
                  if (code >= 400) { olyImgWhy = "HTTP " + code + " " + (c.errorStream?.bufferedReader()?.readText() ?: "").take(60); return null }
                  val d = JSONObject(c.inputStream.bufferedReader().readText()).getJSONArray("data").getJSONObject(0)
                  val b64 = d.optString("b64_json", "")
                  val bytes = if (b64.isNotBlank() && b64 != "null") android.util.Base64.decode(b64, android.util.Base64.DEFAULT)
                      else URL(d.getString("url")).openStream().use { it.readBytes() }
                  return BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
              } catch (e: Exception) { olyImgWhy = e.javaClass.simpleName + " " + (e.message ?: "").take(60) }
              return null
          }
          fun image(prompt0: String): Pair<Bitmap?, String> {
              val cmd = Regex("(?i)gemini access")
              val wantGemini = cmd.containsMatchIn(prompt0)
              val prompt = if (wantGemini) prompt0.replace(cmd, "").trim().ifBlank { "a beautiful picture" } else prompt0
              var why = ""
              if (wantGemini) {
                  val g = geminiImage(prompt)
                  if (g.first != null) return g
                  why = g.second
              }
              val o = olyntaqImage(prompt)
              if (o != null) return o to ""
              var backup = ""
              try {
                  val boosted = if (prompt.contains("detailed", true)) prompt else prompt + ", highly detailed, sharp focus, high resolution, professional quality"
                  val q = java.net.URLEncoder.encode(boosted, "UTF-8").replace("+", "%20")
                  val c = URL("https://image.pollinations.ai/prompt/" + q + "?width=1024&height=1024&nologo=true&enhance=true&model=flux&seed=" + (System.currentTimeMillis() % 100000)).openConnection() as HttpURLConnection
                  c.connectTimeout = 8000; c.readTimeout = 120000
                  if (c.responseCode < 400) {
                      val bytes = c.inputStream.use { it.readBytes() }
                      val bm = BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                      if (bm != null) return bm to ""
                  } else backup = "HTTP " + c.responseCode
              } catch (e: Exception) { backup = e.javaClass.simpleName }
              return null to friendly(why + " | " + olyImgWhy + " | " + backup, true)
          }
          private fun geminiImage(prompt: String): Pair<Bitmap?, String> {"""
              s = s.replace(isig, newimg, 1)
          else:
              print("WARNING: image() not found, image fix not added")

          # 4) chat: a new message replaces the unfinished answer; history is titled by topic and saved
          def sub1(old, new, label, rx=False):
              global s
              s2 = re.sub(old, lambda m: new, s, count=1) if rx else s.replace(old, new, 1)
              if s2 == s:
                  print("WARNING: " + label + " not found, skipped")
              s = s2

          sub1("var busy by mutableStateOf(false);", "var turn = 0; var busy by mutableStateOf(false);", "Store.busy")
          sub1(r"class Chat\(val title: String\)\s*\{\s*val msgs = mutableStateListOf<Msg>\(\)\s*\}",
               "class Chat(title0: String) { var title by mutableStateOf(title0); var named = false; var voice = false; val msgs = mutableStateListOf<Msg>() }", "Chat class", True)
          sub1("c.msgs.add(Msg(text, true, bmp)); busy = true", "c.msgs.add(Msg(text, true, bmp)); busy = true; turn += 1; val my = turn", "ask start")
          sub1("c.msgs.add(Msg(r, false)); busy = false", "if (my != turn) return@launch\n        c.msgs.add(Msg(r, false)); busy = false", "ask reply")
          sub1("done(r)", """done(r)
                  if (!c.named) {
                      c.named = true
                      val first = c.msgs.firstOrNull { it.mine }?.text ?: text
                      val t = withContext(Dispatchers.IO) { Gemini.title(first) }
                      if (t.isNotBlank()) c.title = t
                  }
                  saveChats(ctx)""", "topic title")
          sub1("input.isNotBlank() && !Store.busy", "input.isNotBlank()", "send while busy")
          sub1("fun langTag() = when (lang) {", """fun saveChats(c: Context) {
                  try {
                      val arr = JSONArray(); val keep = HashSet<String>()
                      for (ch in chats) {
                          val ms = JSONArray()
                          for (x in ch.msgs) {
                              val o = JSONObject().put("t", x.text).put("m", x.mine)
                              val bm = x.img
                              if (bm != null) {
                                  val name = "img_" + x.id + ".jpg"; keep.add(name)
                                  val f = File(c.filesDir, name)
                                  if (!f.exists()) f.outputStream().use { bm.compress(Bitmap.CompressFormat.JPEG, 88, it) }
                                  o.put("i", x.id)
                              }
                              ms.put(o)
                          }
                          arr.put(JSONObject().put("title", ch.title).put("v", ch.voice).put("msgs", ms))
                      }
                      File(c.filesDir, "chats.json").writeText(arr.toString())
                      c.filesDir.listFiles()?.forEach { if (it.name.startsWith("img_") && it.name !in keep) it.delete() }
                  } catch (e: Exception) { }
              }
              fun loadChats(c: Context) {
                  try {
                      val f = File(c.filesDir, "chats.json")
                      if (!f.exists()) return
                      val arr = JSONArray(f.readText())
                      chats.clear()
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val ch = Chat(o.getString("title")); ch.named = true; ch.voice = o.optBoolean("v", false)
                          val ms = o.getJSONArray("msgs")
                          for (j in 0 until ms.length()) {
                              val x = ms.getJSONObject(j)
                              var bm: Bitmap? = null
                              if (x.has("i")) {
                                  val pf = File(c.filesDir, "img_" + x.getLong("i") + ".jpg")
                                  if (pf.exists()) bm = BitmapFactory.decodeFile(pf.path)
                              }
                              val m = Msg(x.getString("t"), x.getBoolean("m"), bm)
                              if (x.has("i")) m.id = x.getLong("i")
                              ch.msgs.add(m)
                          }
                          chats.add(ch)
                      }
                  } catch (e: Exception) { }
              }
              // what the AI gets to read: the first message (the topic) plus the latest ones
              fun histOf(c: Chat): List<Pair<String, String>> {
                  val all = c.msgs.dropLast(1).filter { it.text.isNotBlank() && (it.mine || !Gemini.isFailure(it.text)) }
                  val pick = if (all.size > 16) listOf(all.first()) + all.takeLast(14) else all
                  return pick.map { (if (it.mine) "user" else "assistant") to it.text.take(4000) }
              }
              var voiceChat: Chat? = null
              var vturn = 0
              fun askVoice(ctx: Context, text: String, scope: CoroutineScope, done: (String) -> Unit = {}) {
                  val c = voiceChat ?: Chat("Voice chat").also { it.voice = true; chats.add(0, it); voiceChat = it }
                  c.msgs.add(Msg(text, true)); vturn += 1; val my = vturn; val hist = histOf(c)
                  scope.launch {
                      val r = withContext(Dispatchers.IO) { Gemini.text(text, null, hist, false) }
                      if (my != vturn) return@launch
                      c.msgs.add(Msg(r, false))
                      if (!foreground) notify(ctx, "Nexa AI", r)
                      done(r)
                      if (!c.named) {
                          c.named = true
                          val t = withContext(Dispatchers.IO) { Gemini.title(text) }
                          if (t.isNotBlank()) c.title = t
                      }
                      saveChats(ctx)
                  }
              }
              fun langTag() = when (lang) {""", "chat saving")
          sub1('prefs = c.getSharedPreferences("nexa", 0)', 'prefs = c.getSharedPreferences("nexa", 0); loadChats(c)', "load chats")
          sub1("private fun groqText(prompt: String): String? {", """fun title(q: String): String {
              val r = chain("Write a title of 2 to 5 words for the main topic of this message. Reply with only the title, no quotes. Message: " + q.take(300), null) ?: return ""
              return r.lines().first().trim().trim('"', '*', '.').take(40)
          }
          private fun olyntaqText(prompt: String): String? {
              val base = "https://olyntaq-api.onrender.com"
              val tried = StringBuilder()
              val paths = listOf("/v1/chat/completions")
              for (path in paths) {
                  try {
                      val c = URL(base + path).openConnection() as HttpURLConnection
                      c.connectTimeout = 10000; c.readTimeout = 60000
                      c.requestMethod = "POST"; c.doOutput = true
                      c.setRequestProperty("Content-Type", "application/json")
                      c.setRequestProperty("Authorization", "Bearer " + BuildConfig.OLYNTAQ_KEY)
                      c.setRequestProperty("x-api-key", BuildConfig.OLYNTAQ_KEY)
                      val msgs = msgsFor(prompt)
                      val body = JSONObject().put("model", "olyntaq").put("messages", msgs).put("stream", false)
                          .put("message", prompt).put("prompt", prompt).put("text", prompt).put("query", prompt).put("input", prompt)
                      c.outputStream.use { it.write(body.toString().toByteArray()) }
                      val code = c.responseCode
                      val txt = (if (code < 400) c.inputStream else c.errorStream).bufferedReader().readText().trim()
                      tried.append(path).append(":").append(code).append(" ")
                      olyWhy = tried.toString() + "last reply: " + txt.take(70)
                      if (code >= 400) continue
                      if (!txt.startsWith("{")) {
                          if (txt.isNotBlank() && !txt.startsWith("<")) return txt else continue
                      }
                      val r = JSONObject(txt)
