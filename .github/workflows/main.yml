          cat > $RES/xml/nexa_widget_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp" android:minHeight="110dp"
              android:targetCellWidth="4" android:targetCellHeight="2"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/nexa_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"/>
          EOF
          cat > $D/app/src/main/java/com/nexa/ai/NexaWidget.kt <<'EOF'
          package com.nexa.ai

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews

          class NexaWidget : AppWidgetProvider() {
              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  for (id in ids) {
                      val v = RemoteViews(context.packageName, R.layout.nexa_widget)
                      v.setOnClickPendingIntent(R.id.w_title, open(context, "home", 10))
                      v.setOnClickPendingIntent(R.id.w_ask, open(context, "ask", 11))
                      v.setOnClickPendingIntent(R.id.w_voice, open(context, "voice", 12))
                      v.setOnClickPendingIntent(R.id.w_image, open(context, "image", 13))
                      v.setOnClickPendingIntent(R.id.w_history, open(context, "history", 14))
                      manager.updateAppWidget(id, v)
                  }
              }

              private fun open(c: Context, dest: String, code: Int): PendingIntent {
                  val i = Intent(c, MainActivity::class.java).putExtra("dest", dest)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                  return PendingIntent.getActivity(c, code, i, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
              }
          }
          EOF

          cat > $D/settings.gradle.kts <<'EOF'
