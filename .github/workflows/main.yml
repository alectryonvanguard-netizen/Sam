name: Build Nexa AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Assemble project
        run: |
          D=nexa-build
          mkdir -p $D/app/src/main/java/com/nexa/ai
          cp MainActivity.kt FloatingService.kt $D/app/src/main/java/com/nexa/ai/
          SRC_KT=$D/app/src/main/java/com/nexa/ai/MainActivity.kt
          # Google retired gemini-2.0-flash; use the model its error message asks for
          sed -i 's/call("gemini-2.0-flash",/call("gemini-3.8-flash",/' $SRC_KT

          # Patch MainActivity.kt while building:
          #  1) chat header: remove the "Online" line, keep only the logo and the name
          #  2) if VoiceScreen.kt exists in the repo, it replaces the old voice screen
          cat > /tmp/patch.py <<'PY2'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          s2 = re.sub(r'; T\(if \(Store\.busy\) "Typing\.\.\." else "Online", 11, Color\(0xFF34D399\)\)', '', s)
          if s2 == s:
              print("WARNING: Online line not found, chat header left unchanged")
          s = s2
          # 3) Gemini: try 3.8 first, then 3.6, and retry when Google says "high demand"
          sig = "private fun call(model: String, body: JSONObject): JSONObject {"
          if sig in s:
              helper = (
                  'private val TEXT_MODELS = listOf("gemini-3.8-flash", "gemini-3.6-flash")\n'
                  'private fun call(model: String, body: JSONObject): JSONObject {\n'
                  '    if (!model.startsWith("gemini-3")) return callOnce(model, body)\n'
                  '    var last = JSONObject()\n'
                  '    for (m in TEXT_MODELS) {\n'
                  '        for (attempt in 0..1) {\n'
                  '            last = callOnce(m, body)\n'
                  '            val err = last.optJSONObject("error") ?: return last\n'
                  '            val msg = err.optString("message")\n'
                  '            val code = err.optInt("code")\n'
                  '            val retry = code == 503 || code == 429 || code == 404 || msg.contains("high demand", true) || msg.contains("overloaded", true)\n'
                  '            if (!retry) return last\n'
                  '            Thread.sleep(800)\n'
                  '        }\n'
                  '    }\n'
                  '    return last\n'
                  '}\n'
                  'private fun callOnce(model: String, body: JSONObject): JSONObject {'
              )
              s = s.replace(sig, helper, 1)
          else:
              print("WARNING: Gemini call() not found, model fallback not added")
          if len(sys.argv) > 2 and sys.argv[2] == "voice":
              a = s.find("@Composable fun VoiceScreen() {")
              b = s.find("@Composable fun ImageGen() {")
              if a < 0 or b < 0 or b < a:
                  print("ERROR: old VoiceScreen not found in MainActivity.kt")
                  sys.exit(1)
              s = s[:a] + s[b:]
          open(p, "w", encoding="utf-8").write(s)
          PY2
          if [ -f VoiceScreen.kt ]; then
            cp VoiceScreen.kt $D/app/src/main/java/com/nexa/ai/
            python3 /tmp/patch.py $SRC_KT voice
          else
            python3 /tmp/patch.py $SRC_KT
          fi

          # ---- Branding images: resized safely, skipped if they cannot be processed ----
          RES=$D/app/src/main/res
          ICON_ATTR=""
          pip install --quiet pillow 2>/dev/null || pip install --quiet --break-system-packages pillow 2>/dev/null || true
          cat > /tmp/rs.py <<'PY'
          import sys
          from PIL import Image, ImageDraw
          src, dst, px = sys.argv[1], sys.argv[2], int(sys.argv[3])
          cut = len(sys.argv) > 4 and sys.argv[4] == "cut"
          im = Image.open(src).convert("RGBA")
          im.thumbnail((px, px))
          if cut:
              # remove the black background that touches the image edges (soft edge, keeps dark parts inside the robot)
              T = 120
              w, h = im.size
              pix = im.load()
              mask = Image.new("L", (w, h), 0)
              mp = mask.load()
              for y in range(h):
                  for x in range(w):
                      r, g, b, a = pix[x, y]
                      if max(r, g, b) < T:
                          mp[x, y] = 255
              border = [(x, 0) for x in range(w)] + [(x, h - 1) for x in range(w)] + [(0, y) for y in range(h)] + [(w - 1, y) for y in range(h)]
              for pt in border:
                  if mp[pt] == 255:
                      ImageDraw.floodfill(mask, pt, 128)
              for y in range(h):
                  for x in range(w):
                      if mp[x, y] == 128:
                          r, g, b, a = pix[x, y]
                          pix[x, y] = (r, g, b, min(255, max(r, g, b) * 255 // T))
          im.save(dst, "PNG")
          PY
          rs() {
            python3 /tmp/rs.py "$1" "$2" "$3" "$4" && return 0
            magick "$1[0]" -resize "${3}x${3}>" PNG32:"$2" && return 0
            convert "$1[0]" -resize "${3}x${3}>" PNG32:"$2" && return 0
            return 1
          }
          pick() { for f in "$@"; do if [ -f "$f" ]; then echo "$f"; return 0; fi; done; return 0; }

          ROBOT=$(pick nexa_robot.png robot.png app/src/main/res/drawable/nexa_robot.png)
          LOGO=$(pick nexa_icon.png logo.png app/src/main/res/drawable/nexa_icon.png)
          ICON=$(pick icon.png nexa_icon.png app/src/main/res/drawable/nexa_icon.png)
          echo "robot=$ROBOT logo=$LOGO icon=$ICON"

          if [ -n "$ROBOT" ]; then
            mkdir -p $RES/drawable-nodpi
            rs "$ROBOT" $RES/drawable-nodpi/nexa_robot.png 512 cut || { echo "robot resize failed, skipped"; rm -f $RES/drawable-nodpi/nexa_robot.png; }
          fi
          if [ -n "$LOGO" ]; then
            mkdir -p $RES/drawable-nodpi
            rs "$LOGO" $RES/drawable-nodpi/nexa_logo.png 256 cut || { echo "logo resize failed, skipped"; rm -f $RES/drawable-nodpi/nexa_logo.png; }
          fi
          if [ -n "$ICON" ]; then
            mkdir -p $RES/mipmap-xxxhdpi
            if rs "$ICON" $RES/mipmap-xxxhdpi/ic_launcher.png 192; then
              ICON_ATTR='android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"'
            else
              echo "icon resize failed, default icon used"; rm -f $RES/mipmap-xxxhdpi/ic_launcher.png
            fi
          fi

          cat > $D/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NexaAI"
          include(":app")
          EOF

          cat > $D/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF

          printf 'org.gradle.jvmargs=-Xmx2g\nandroid.useAndroidX=true\n' > $D/gradle.properties

          cat > $D/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.nexa.ai"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.nexa.ai"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
                  buildConfigField("String", "GEMINI_KEY", "\"${System.getenv("GEMINI_API_KEY") ?: ""}\"")
              }
              buildFeatures { compose = true; buildConfig = true }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat > $D/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries>
              <application android:label="Nexa AI" ICON_PLACEHOLDER android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatingService" android:exported="false"/>
              </application>
          </manifest>
          EOF

          sed -i "s|ICON_PLACEHOLDER|$ICON_ATTR|" $D/app/src/main/AndroidManifest.xml

          echo "Resources included:"
          find $RES -type f -exec ls -l {} \; 2>/dev/null || echo "(none)"

      - name: Check API key secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY SECRET IS EMPTY - add it under Settings > Secrets and variables > Actions > Secrets"; exit 1; }

      - name: Build debug APK
        working-directory: nexa-build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NexaAI-debug
          path: nexa-build/app/build/outputs/apk/debug/*.apk
